name: Build Android APK

# Builds an installable APK in the cloud, so no Android Studio is needed.
# Run it from the repo's Actions tab ("Run workflow"), then download the artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # `npm install` (not `npm ci`): it also refreshes the lockfile after the Capacitor packages were added.
      - run: npm install --no-audit --no-fund

      - name: Build debug APK
        run: npm run android:apk
        env:
          # Optional: set these under Settings → Secrets and variables → Actions.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MUNCH_API_URL: ${{ secrets.VITE_MUNCH_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: munch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
